name: Deploy Minecraft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      MINECRAFT_WHITELIST: ${{ vars.MINECRAFT_WHITELIST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Check deployment settings
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN" || { echo 'Missing FLY_API_TOKEN secret'; exit 1; }
          test -n "$MINECRAFT_WHITELIST" || { echo 'Set MINECRAFT_WHITELIST to comma-separated Java usernames'; exit 1; }
          flyctl config validate --strict
      - name: Update whitelist
        run: flyctl secrets set --stage "WHITELIST=$MINECRAFT_WHITELIST"
      - name: Deploy one persistent server
        run: flyctl deploy --remote-only --ha=false --strategy immediate
